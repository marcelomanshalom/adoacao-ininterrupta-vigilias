<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adoração Ininterrupta - Missão Guarulhos</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-light: #e0e7ff;
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-secondary: #475569;
            --border: #cbd5e1;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 30px 15px;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 1300px;
            margin: 0 auto;
            background-color: var(--card-bg);
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: 30px;
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 26px;
            color: var(--text-main);
            margin: 0;
            font-weight: 800;
        }

        /* Navegação por Meses */
        .months-nav {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 25px;
            justify-content: center;
            scrollbar-width: thin;
        }

        .month-btn {
            background-color: #f1f5f9;
            border: none;
            border-radius: 12px;
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .month-btn:hover {
            background-color: #e2e8f0;
            color: var(--text-main);
        }

        .month-btn.active {
            background-color: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        .month-section {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        .month-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-top: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 13px;
            background-color: white;
        }

        th, td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            border-right: 1px solid var(--border);
        }

        th:last-child, td:last-child {
            border-right: none;
        }

        th {
            background-color: #f8fafc;
            color: var(--text-main);
            font-weight: 700;
            text-align: center;
            white-space: nowrap;
        }

        /* Inputs editáveis do cabeçalho de dias */
        th input {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px;
            font-size: 12px;
            font-weight: 600;
            color: var(--primary);
            text-align: center;
            width: 90%;
            outline: none;
        }
        th input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px var(--primary-light);
        }

        .time-col {
            font-weight: 600;
            color: var(--primary);
            background-color: #f8fafc;
            text-align: center;
            white-space: nowrap;
            width: 120px;
        }

        .slot-cell {
            cursor: pointer;
            transition: background-color 0.15s;
            text-align: center;
            vertical-align: middle;
            min-width: 110px;
        }

        .slot-cell:hover {
            background-color: #f1f5f9;
        }

        /* Tags agregadas para múltiplos nomes */
        .participant-tags {
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: center;
        }

        .tag {
            background-color: var(--primary-light);
            color: var(--primary);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
            word-break: break-word;
            width: 100%;
            box-sizing: border-box;
        }

        .instructions {
            background-color: var(--primary-light);
            color: var(--primary);
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Missão Guarulhos</h1>
        </header>

        <div class="instructions">
            💡 Dica: Clique em qualquer horário disponível na tabela abaixo para preencher o seu nome ou o da sua célula/grupo. Várias pessoas podem preencher o mesmo horário!
        </div>
        
        <!-- Navegação de Meses 2026 / 2027 -->
        <div class="months-nav" id="monthsNav">
            <button class="month-btn active" onclick="showMonth('jan-2026', this)">Jan 2026</button>
            <button class="month-btn" onclick="showMonth('fev-2026', this)">Fev 2026</button>
            <button class="month-btn" onclick="showMonth('mar-2026', this)">Mar 2026</button>
            <button class="month-btn" onclick="showMonth('abr-2026', this)">Abr 2026</button>
            <button class="month-btn" onclick="showMonth('mai-2026', this)">Mai 2026</button>
            <button class="month-btn" onclick="showMonth('jun-2026', this)">Jun 2026</button>
            <button class="month-btn" onclick="showMonth('jul-2026', this)">Jul 2026</button>
            <button class="month-btn" onclick="showMonth('ago-2026', this)">Ago 2026</button>
            <button class="month-btn" onclick="showMonth('set-2026', this)">Set 2026</button>
            <button class="month-btn" onclick="showMonth('out-2026', this)">Out 2026</button>
            <button class="month-btn" onclick="showMonth('nov-2026', this)">Nov 2026</button>
            <button class="month-btn" onclick="showMonth('dez-2026', this)">Dez 2026</button>
            <button class="month-btn" onclick="showMonth('jan-2027', this)">Jan 2027</button>
            <button class="month-btn" onclick="showMonth('fev-2027', this)">Fev 2027</button>
            <button class="month-btn" onclick="showMonth('mar-2027', this)">Mar 2027</button>
            <button class="month-btn" onclick="showMonth('abr-2027', this)">Abr 2027</button>
            <button class="month-btn" onclick="showMonth('mai-2027', this)">Mai 2027</button>
            <button class="month-btn" onclick="showMonth('jun-2027', this)">Jun 2027</button>
            <button class="month-btn" onclick="showMonth('jul-2027', this)">Jul 2027</button>
            <button class="month-btn" onclick="showMonth('ago-2027', this)">Ago 2027</button>
            <button class="month-btn" onclick="showMonth('set-2027', this)">Set 2027</button>
            <button class="month-btn" onclick="showMonth('out-2027', this)">Out 2027</button>
            <button class="month-btn" onclick="showMonth('nov-2027', this)">Nov 2027</button>
            <button class="month-btn" onclick="showMonth('dez-2027', this)">Dez 2027</button>
        </div>

        <div id="contentContainer">
            <!-- Gerador dinâmico de meses -->
            <script>
                const meses = [
                    { id: 'jan-2026', nome: 'Janeiro de 2026' }, { id: 'fev-2026', nome: 'Fevereiro de 2026' },
                    { id: 'mar-2026', nome: 'Março de 2026' }, { id: 'abr-2026', nome: 'Abril de 2026' },
                    { id: 'mai-2026', nome: 'Maio de 2026' }, { id: 'jun-2026', nome: 'Junho de 2026' },
                    { id: 'jul-2026', nome: 'Julho de 2026' }, { id: 'ago-2026', nome: 'Agosto de 2026' },
                    { id: 'set-2026', nome: 'Setembro de 2026' }, { id: 'out-2026', nome: 'Outubro de 2026' },
                    { id: 'nov-2026', nome: 'Novembro de 2026' }, { id: 'dez-2026', nome: 'Dezembro de 2026' },
                    { id: 'jan-2027', nome: 'Janeiro de 2027' }, { id: 'fev-2027', nome: 'Fevereiro de 2027' },
                    { id: 'mar-2027', nome: 'Março de 2027' }, { id: 'abr-2027', nome: 'Abril de 2027' },
                    { id: 'mai-2027', nome: 'Maio de 2027' }, { id: 'jun-2027', nome: 'Junho de 2027' },
                    { id: 'jul-2027', nome: 'Julho de 2027' }, { id: 'ago-2027', nome: 'Agosto de 2027' },
                    { id: 'set-2027', nome: 'Setembro de 2027' }, { id: 'out-2027', nome: 'Outubro de 2027' },
                    { id: 'nov-2027', nome: 'Novembro de 2027' }, { id: 'dez-2027', nome: 'Dezembro de 2027' }
                ];

                const diasSemana = [
                    "Segunda (19h)", "Terça", "Quarta", "Quinta", "Sexta", "Sábado", "Domingo", "Segunda (até 19h)"
                ];

                // Horários padrão da adoração ininterrupta (da 19h de uma segunda até 19h da seguinte)
                const horarios = [
                    "19:00 as 20:00", "20:00 as 21:00", "21:00 as 22:00", "22:00 as 23:00", 
                    "23:00 as 00:00", "00:00 as 01:00", "01:00 as 02:00", "02:00 as 03:00", 
                    "03:00 as 04:00", "04:00 as 05:00", "05:00 as 06:00", "06:00 as 07:00", 
                    "07:00 as 08:00", "08:00 as 09:00", "09:00 as 10:00", "10:00 as 11:00", 
                    "11:00 as 12:00", "12:00 as 13:00", "13:00 as 14:00", "14:00 as 15:00", 
                    "15:00 as 16:00", "16:00 as 17:00", "17:00 as 18:00", "18:00 as 19:00"
                ];

                document.write(meses.map((m, index) => `
                    <div id="${m.id}" class="month-section ${index === 0 ? 'active' : ''}">
                        <h2 style="font-size:18px; color:var(--primary); margin-bottom:15px;">${m.nome}</h2>
                        <div class="table-responsive">
                            <table>
                                <thead>
                                    <tr>
                                        <th>HORÁRIO</th>
                                        ${diasSemana.map((d, i) => `<th><input type="text" value="Dia - ${d}" onchange="saveData()"></th>`).join('')}
                                    </tr>
                                </thead>
                                <tbody>
                                    ${horarios.map(h => `
                                        <tr>
                                            <td class="time-col">${h}</td>${diasSemana.map(() => `<td class="slot-cell" onclick="addParticipant(this)"><div class="participant-tags"></div></td>`).join('')}
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `).join(''));
            </script>
        </div>
    </div>

    <script>
        function showMonth(monthId, btnElement) {
            document.querySelectorAll('.month-section').forEach(section => {
                section.classList.remove('active');
            });
            document.querySelectorAll('.month-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            document.getElementById(monthId).classList.add('active');
            btnElement.classList.add('active');
        }

        function addParticipant(cell) {
            let container = cell.querySelector('.participant-tags');
            let nome = prompt("Digite seu nome ou o da sua célula/grupo para este horário:");
            
            if (nome && nome.trim() !== "") {
                let tag = document.createElement('div');
                tag.className = 'tag';
                tag.innerText = nome.trim();
                container.appendChild(tag);
                saveData();
            }
        }

        // Salvar estado completo (incluindo inputs de dias e participantes) no navegador
        function saveData() {
            let data = {};
            document.querySelectorAll('.month-section').forEach(sec => {
                let id = sec.id;
                let inputs = [];
                sec.querySelectorAll('th input').forEach(input => inputs.push(input.value));
                
                let rowsData = [];
                sec.querySelectorAll('tbody tr').forEach(row => {
                    let rData = [];
                    row.querySelectorAll('.participant-tags').forEach(container => {
                        let tags = [];
                        container.querySelectorAll('.tag').forEach(t => tags.push(t.innerText));
                        rData.push(tags);
                    });
                    rowsData.push(rData);
                });
                data[id] = { inputs, rowsData };
            });
            localStorage.setItem('adoracao_escala_v2', JSON.stringify(data));
        }

        // Carregar dados salvos ao abrir
        window.onload = function() {
            let saved = localStorage.getItem('adoracao_escala_v2');
            if (saved) {
                let data = JSON.parse(saved);
                for (let monthId in data) {
                    let sec = document.getElementById(monthId);
                    if (sec) {
                        let inputs = sec.querySelectorAll('th input');
                        data[monthId].inputs.forEach((val, idx) => {
                            if (inputs[idx]) inputs[idx].value = val;
                        });

                        let rows = sec.querySelectorAll('tbody tr');
                        data[monthId].rowsData.forEach((rData, rIdx) => {
                            if (rows[rIdx]) {
                                let containers = rows[rIdx].querySelectorAll('.participant-tags');
                                rData.forEach((tagsArray, cIdx) => {
                                    if (containers[cIdx]) {
                                        containers[cIdx].innerHTML = '';
                                        tagsArray.forEach(tagName => {
                                            let tag = document.createElement('div');
                                            tag.className = 'tag';
                                            tag.innerText = tagName;
                                            containers[cIdx].appendChild(tag);
                                        });
                                    }
                                });
                            }
                        });
                    }
                }
            }
        };
    </script>
</body>
</html>
